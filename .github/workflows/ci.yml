name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install OS development tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang lld make curl xorriso qemu-system-x86 python3

      - name: Check tools
        run: make check-tools

      - name: Unit tests
        run: make test-host

      - name: Unit memory-safety checks
        run: make test-host-sanitized

      - name: Build bootable ISO
        run: make TOOLCHAIN=llvm

      - name: Smoke test in QEMU
        run: make smoke TOOLCHAIN=llvm

      - name: Desktop interaction tests
        run: make desktop-test TOOLCHAIN=llvm

      - name: Cross-vendor CPU and firmware reporting matrix
        run: make cpu-test TOOLCHAIN=llvm

      - name: Desktop at 640x480
        run: |
          make iso TOOLCHAIN=llvm ISO=build/myos-640.iso LIMINE_CONFIG=tests/limine-640.conf
          python3 scripts/desktop-test.py build/myos-640.iso --expect-size 640x480 --memory 128M --output-dir build/desktop-test-640

      - name: Full usable-memory allocation and recovery
        run: |
          python3 tests/test_memory_cleanup.py
          python3 scripts/memory-test.py --memory 64 1024 4096 8192 16384
          python3 scripts/memory-test.py --memory 64 1025 16384 --resolution 640x480 --output-dir build/memory-tests-640

      - name: CPU exception and panic tests
        run: make panic-test TOOLCHAIN=llvm

      - name: Interrupt routing and idle regression tests
        run: make timer-test TOOLCHAIN=llvm

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: shawnos-v0.3.1-x86_64-iso
          path: build/myos-x86_64.iso

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-test-evidence
          path: |
            build/desktop-test/
            build/desktop-test-640/
            build/memory-tests/**/result.json
            build/memory-tests/**/serial.log
            build/memory-tests/**/qemu.log
            build/memory-tests/**/test-output.log
            build/memory-tests/**/memory-about.ppm
            build/memory-tests/**/failure*.ppm
            build/memory-tests-640/**/result.json
            build/memory-tests-640/**/serial.log
            build/memory-tests-640/**/qemu.log
            build/memory-tests-640/**/test-output.log
            build/memory-tests-640/**/memory-about.ppm
            build/memory-tests-640/**/failure*.ppm
            build/cpu-tests/
            build/smoke-serial.log
            build/panic-tests/**/panic.ppm
            build/panic-tests/**/serial.log
            build/panic-tests/**/qemu.log
            build/panic-tests/**/registers.txt
            build/panic-tests/result.json
            build/timer-tests/**/serial.log
            build/timer-tests/**/qemu.log
            build/timer-tests/**/registers.txt
            build/timer-tests/**/failure-*.txt
            build/timer-tests/**/screen.ppm
            build/timer-tests/result.json

  virtualbox-profile-self-tests:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate VirtualBox CPU profiles without starting VMs
        shell: pwsh
        run: ./scripts/virtualbox-cpu-test.ps1 -Mode SelfTest

