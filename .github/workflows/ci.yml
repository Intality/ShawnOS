name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install OS development tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld make curl xorriso qemu-system-x86

      - name: Check tools
        run: make check-tools

      - name: Build bootable ISO
        run: make TOOLCHAIN=llvm

      - name: Smoke test in QEMU
        run: make smoke TOOLCHAIN=llvm

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: myos-v0.1.0-x86_64-iso
          path: build/myos-x86_64.iso

